[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "er-afd"
version = "0.1.0"
description = "Convertidor educativo de expresiones regulares a AFD"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
er-afd = "er_afd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["er_afd*"]


